plugins { id 'com.android.application' }

def storePath = System.getenv('KONTOKOMPASS_STORE_FILE')
def signingStorePass = System.getenv('KONTOKOMPASS_STORE_PASSWORD')
def signingAlias = System.getenv('KONTOKOMPASS_KEY_ALIAS')
def signingKeyPass = System.getenv('KONTOKOMPASS_KEY_PASSWORD')
def canSign = storePath && signingStorePass && signingAlias && signingKeyPass

android {
    namespace 'no.kontokompass.app'
    sourceSets { main { assets.srcDirs = ['../shared/assets'] } }
    compileSdk 35

    defaultConfig {
        applicationId 'no.kontokompass.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }
    if (canSign) {
        signingConfigs {
            localRelease {
                storeFile file(storePath)
                storePassword signingStorePass
                keyAlias signingAlias
                keyPassword signingKeyPass
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.localRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
